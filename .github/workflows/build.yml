name: Build Ayanami Ramdisk

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Identificador (ej: iPhone11,8 para XR, iPhone12,5 para 11 Pro Max)'
        required: true
        default: 'iPhone11,8'
      model:
        description: 'Board (ej: n841ap para XR, d431ap para 11 Pro Max)'
        required: true
        default: 'n841ap'
      cpid:
        description: 'CPID (0x8020 = A12 / 0x8030 = A13)'
        required: true
        default: '0x8020'
      ios_version:
        description: 'Version de iOS a construir'
        required: true
        default: '18.5'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Mostrar banner ICH
        run: |
          echo "============================================"
          echo "  ICH A12/A13 Ramdisk Builder"
          echo "  by @Official_I_C_H"
          echo "  Telegram: https://t.me/Official_I_C_H"
          echo "============================================"
          echo ""
          echo "Target: ${{ inputs.product }} (${{ inputs.model }})"
          echo "CPID: ${{ inputs.cpid }}"
          echo "iOS: ${{ inputs.ios_version }}"

      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Instalar ipsw
        run: |
          curl -L -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.707/ipsw_3.1.707_macOS_arm64.tar.gz
          mkdir -p /tmp/ipsw-bin
          tar -xzf /tmp/ipsw.tar.gz -C /tmp/ipsw-bin
          IPSW_BIN=$(find /tmp/ipsw-bin -type f -name ipsw | head -1)
          sudo install -m 755 "$IPSW_BIN" /usr/local/bin/ipsw
          ipsw version

      - name: Instalar libpng para ibootim (logo ICH)
        run: |
          if [ ! -f /usr/local/bin/brew ]; then
            echo "Instalando x86_64 Homebrew..."
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          fi
          if [ -f /usr/local/bin/brew ]; then
            echo "Instalando libpng x86_64..."
            arch -x86_64 /usr/local/bin/brew install libpng 2>/dev/null || true
          fi
          brew install libpng 2>/dev/null || true
          sudo mkdir -p /usr/local/opt/libpng/lib 2>/dev/null || true
          if [ -f /usr/local/opt/libpng/lib/libpng16.16.dylib ]; then
            echo "OK: libpng x86_64 encontrado"
          elif [ -f /opt/homebrew/opt/libpng/lib/libpng16.16.dylib ]; then
            echo "Creando symlink de ARM a x86_64 path..."
            sudo ln -sf /opt/homebrew/opt/libpng/lib/libpng16.16.dylib /usr/local/opt/libpng/lib/libpng16.16.dylib 2>/dev/null || true
          fi
          ls -la /usr/local/opt/libpng/lib/libpng16.16.dylib 2>/dev/null && echo "libpng OK" || echo "WARNING: libpng no encontrado"

      - name: Instalar dependencias Python
        run: |
          pip3 install --break-system-packages -r requirements.txt || true
          /usr/bin/python3 -m pip install --user -r requirements.txt
          /usr/bin/python3 -c "import pyimg4, capstone; print('pyimg4 OK')"

      - name: Construir bootchain con logo ICH
        env:
          CI_PRODUCT: ${{ inputs.product }}
          CI_MODEL: ${{ inputs.model }}
          CI_CPID: ${{ inputs.cpid }}
        run: |
          chmod +x build.sh boot.sh setup.sh
          chmod +x tools/darwin/* scripts/*.sh 2>/dev/null || true
          ./build.sh --version "${{ inputs.ios_version }}" --kpf-set ios18 --with-fw

      - name: Verificar logo ICH
        run: |
          echo "=== Verificando logo ICH ==="
          find bootchain/ -name "logo.img4" -exec ls -la {} \;
          if [ -f bootchain/*/logo.img4 ]; then
            echo "OK: logo.img4 creado correctamente"
            echo "El logo ICH se mostrara en pantalla durante el boot"
          else
            echo "WARNING: logo.img4 no encontrado"
          fi

      - name: Subir el bootchain generado
        uses: actions/upload-artifact@v4
        with:
          name: bootchain-${{ inputs.model }}-${{ inputs.ios_version }}
          path: bootchain/
          retention-days: 30
