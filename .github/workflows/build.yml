name: Build Ayanami Ramdisk

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Identificador (ej: iPhone12,5 para 11 Pro Max)'
        required: true
        default: 'iPhone12,5'
      model:
        description: 'Board (ej: d431ap para 11 Pro Max)'
        required: true
        default: 'd431ap'
      cpid:
        description: 'CPID (0x8020 = A12 / 0x8030 = A13)'
        required: true
        default: '0x8030'
      ios_version:
        description: 'Version de iOS a construir'
        required: true
        default: '26.5'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Rosetta (para binarios Intel del repo)
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Instalar ipsw SIN Homebrew (descarga directa)
        run: |
          set -e
          ASSETS=$(curl -s https://api.github.com/repos/blacktop/ipsw/releases/latest | grep "browser_download_url" | cut -d '"' -f 4)
          echo "Assets disponibles:"
          echo "$ASSETS"
          # Preferir el CLI 'ipsw' para macOS arm64; excluir ipswd (daemon) y frida
          IPSW_URL=$(echo "$ASSETS" | grep -i "macos" | grep -i "arm64" | grep -vi frida | grep -vi ipswd | grep -iE "/ipsw_" | head -1)
          if [[ -z "$IPSW_URL" ]]; then
            IPSW_URL=$(echo "$ASSETS" | grep -i "macos" | grep -i "arm64" | grep -vi frida | grep -vi ipswd | head -1)
          fi
          if [[ -z "$IPSW_URL" ]]; then
            echo "ERROR: no se encontro el asset del CLI ipsw."
            exit 1
          fi
          echo "Descargando: $IPSW_URL"
          curl -L -o /tmp/ipsw_pkg "$IPSW_URL"
          mkdir -p /tmp/ipsw-bin
          if [[ "$IPSW_URL" == *.zip ]]; then
            unzip -o /tmp/ipsw_pkg -d /tmp/ipsw-bin
          else
            tar -xzf /tmp/ipsw_pkg -C /tmp/ipsw-bin
          fi
          IPSW_BIN=$(find /tmp/ipsw-bin -type f -name ipsw | head -1)
          [[ -n "$IPSW_BIN" ]] || { echo "ERROR: binario ipsw no encontrado tras extraer"; ls -laR /tmp/ipsw-bin; exit 1; }
          sudo install -m 755 "$IPSW_BIN" /usr/local/bin/ipsw
          ipsw version

      - name: Instalar dependencias Python
        run: pip3 install -r requirements.txt || pip3 install --break-system-packages -r requirements.txt

      - name: Construir bootchain
        env:
          CI_PRODUCT: ${{ inputs.product }}
          CI_MODEL: ${{ inputs.model }}
          CI_CPID: ${{ inputs.cpid }}
        run: |
          chmod +x build.sh boot.sh setup.sh
          chmod +x tools/darwin/* scripts/*.sh 2>/dev/null || true
          ./build.sh --version "${{ inputs.ios_version }}" --with-fw

      - name: Subir el bootchain generado
        uses: actions/upload-artifact@v4
        with:
          name: bootchain-${{ inputs.model }}-${{ inputs.ios_version }}
          path: bootchain/
          retention-days: 30
