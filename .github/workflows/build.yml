name: Build Ayanami Ramdisk

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Identificador (ej: iPhone11,8 para XR / iPhone12,5 para 11 Pro Max)'
        required: true
        default: 'iPhone12,5'
      model:
        description: 'Board (ej: n841ap para XR / d431ap para 11 Pro Max)'
        required: true
        default: 'd431ap'
      cpid:
        description: 'CPID (0x8020 = A12 / 0x8030 = A13)'
        required: true
        default: '0x8030'
      ios_version:
        description: 'Version de iOS a construir (ej: 26.5)'
        required: true
        default: '26.5'

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          if brew install blacktop/tap/ipsw 2>/dev/null; then
            echo "ipsw instalado via brew"
          else
            echo "brew fallo - instalando ipsw desde GitHub releases..."
            IPSW_URL=$(curl -s https://api.github.com/repos/blacktop/ipsw/releases/latest | grep "browser_download_url" | grep "macOS_arm64" | grep -v frida | head -1 | cut -d '"' -f 4)
            curl -L -o /tmp/ipsw.zip "$IPSW_URL"
            unzip -o /tmp/ipsw.zip -d /tmp/ipsw-bin
            sudo install -m 755 /tmp/ipsw-bin/ipsw /usr/local/bin/ipsw
          fi
          ipsw version || true
          pip3 install -r requirements.txt || pip3 install --break-system-packages -r requirements.txt

      - name: Construir bootchain
        env:
          CI_PRODUCT: ${{ inputs.product }}
          CI_MODEL: ${{ inputs.model }}
          CI_CPID: ${{ inputs.cpid }}
        run: |
          chmod +x build.sh boot.sh setup.sh
          chmod +x tools/darwin/* scripts/*.sh 2>/dev/null || true
          ./build.sh --version "${{ inputs.ios_version }}" --with-fw

      - name: Subir el bootchain generado
        uses: actions/upload-artifact@v4
        with:
          name: bootchain-${{ inputs.model }}-${{ inputs.ios_version }}
          path: bootchain/
          retention-days: 30
